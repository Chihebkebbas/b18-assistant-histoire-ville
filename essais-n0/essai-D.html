<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot – Histoire de Paris</title>
    <style>
      :root {
        --bg: #14121a;
        --panel: #1e1a29;
        --panel-2: #272136;
        --accent: #d4a24c;
        --accent-2: #7c6bb8;
        --text: #f1eef7;
        --muted: #a79fc0;
        --bubble-bot: #2c2440;
        --bubble-user: #4a3c78;
        --radius: 14px;
        font-family: "Georgia", "Times New Roman", serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background:
          radial-gradient(
            1200px 500px at 80% -10%,
            rgba(124, 107, 184, 0.25),
            transparent 60%
          ),
          radial-gradient(
            900px 400px at 10% 110%,
            rgba(212, 162, 76, 0.15),
            transparent 60%
          ),
          var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }
      .app {
        width: 100%;
        max-width: 720px;
        height: 92vh;
        max-height: 860px;
        background: var(--panel);
        border: 1px solid rgba(212, 162, 76, 0.35);
        border-radius: 20px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        padding: 16px 20px 12px;
        border-bottom: 1px solid rgba(212, 162, 76, 0.25);
        background: linear-gradient(
          180deg,
          rgba(212, 162, 76, 0.1),
          transparent
        );
        display: flex;
        gap: 14px;
        align-items: center;
      }
      header .logo {
        width: 46px;
        height: 46px;
        flex: 0 0 46px;
      }
      header h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0.5px;
        color: var(--accent);
        font-weight: 600;
      }
      header p {
        margin: 3px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
      header .status {
        margin-left: auto;
        font-size: 12px;
        color: #8fd6a0;
        white-space: nowrap;
      }
      header .status::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4caf6d;
        margin-right: 6px;
        vertical-align: middle;
      }
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 18px 18px 8px;
        scroll-behavior: smooth;
      }
      .msg {
        display: flex;
        gap: 10px;
        margin-bottom: 14px;
        animation: pop 0.25s ease-out;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .msg .avatar {
        width: 34px;
        height: 34px;
        flex: 0 0 34px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        background: var(--panel-2);
        border: 1px solid rgba(212, 162, 76, 0.4);
      }
      .msg .bubble {
        max-width: 82%;
        padding: 11px 14px;
        border-radius: var(--radius);
        font-size: 15px;
        line-height: 1.55;
        white-space: pre-line;
      }
      .msg.bot .bubble {
        background: var(--bubble-bot);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-top-left-radius: 4px;
      }
      .msg.user {
        flex-direction: row-reverse;
      }
      .msg.user .avatar {
        background: #3a3157;
      }
      .msg.user .bubble {
        background: var(--bubble-user);
        border-top-right-radius: 4px;
      }
      .msg .bubble b {
        color: var(--accent);
        font-weight: 600;
      }
      .typing .bubble {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        padding: 15px 16px;
      }
      .typing .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
        animation: blink 1.1s infinite;
      }
      .typing .dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing .dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes blink {
        0%,
        60%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        30% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 6px 18px 12px;
      }
      .chip {
        font-family: inherit;
        font-size: 12.5px;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid rgba(212, 162, 76, 0.35);
        border-radius: 999px;
        padding: 6px 12px;
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.1s;
      }
      .chip:hover {
        background: #342b4a;
      }
      .chip:active {
        transform: scale(0.96);
      }
      form {
        display: flex;
        gap: 10px;
        padding: 12px 16px 16px;
        border-top: 1px solid rgba(212, 162, 76, 0.2);
      }
      input {
        flex: 1;
        font-family: inherit;
        font-size: 15px;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        padding: 12px 18px;
        outline: none;
      }
      input:focus {
        border-color: var(--accent);
      }
      input::placeholder {
        color: var(--muted);
      }
      button.send {
        font-family: inherit;
        font-size: 15px;
        color: #1c1610;
        background: linear-gradient(180deg, #e8bb63, var(--accent));
        border: none;
        border-radius: 999px;
        padding: 12px 22px;
        cursor: pointer;
        font-weight: 700;
        transition:
          filter 0.15s,
          transform 0.1s;
      }
      button.send:hover {
        filter: brightness(1.08);
      }
      button.send:active {
        transform: scale(0.96);
      }
      #chat::-webkit-scrollbar {
        width: 10px;
      }
      #chat::-webkit-scrollbar-thumb {
        background: #3a3350;
        border-radius: 10px;
      }
      #chat::-webkit-scrollbar-track {
        background: transparent;
      }
      @media (max-height: 560px) {
        .app {
          height: 100vh;
          max-height: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" role="application" aria-label="Chatbot histoire de Paris">
      <header>
        <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
          <circle
            cx="24"
            cy="24"
            r="22"
            fill="#272136"
            stroke="#d4a24c"
            stroke-width="2"
          />
          <path
            d="M8 32 Q18 22 24 28 Q30 22 40 32 L40 36 L8 36 Z"
            fill="#d4a24c"
            opacity="0.9"
          />
          <path
            d="M14 30 Q24 18 34 30"
            fill="none"
            stroke="#f1eef7"
            stroke-width="2"
          />
          <circle cx="24" cy="12" r="3" fill="#7c6bb8" />
        </svg>
        <div>
          <h1>Histoire d'une ville — Paris</h1>
          <p>
            De Lutèce à nos jours, posez vos questions sur 2 000 ans d'histoire.
          </p>
        </div>
        <span class="status">En ligne</span>
      </header>

      <div id="chat" aria-live="polite"></div>

      <div class="chips" id="chips"></div>

      <form id="form" autocomplete="off">
        <input
          id="input"
          type="text"
          placeholder="Posez une question : la Révolution, Haussmann, la Tour Eiffel…"
          aria-label="Votre question"
        />
        <button class="send" type="submit">Envoyer</button>
      </form>
    </div>

          ],
          answer:
            "Quelques jalons : environ 200 000 habitants vers 1300 (première ville d'Europe), ~300 000 au XVIᵉ siècle, ~600 000 sous Louis XIV, ~1 million en 1840, **2,7 millions en 1921** (record historique !). Puis la ville se dépeuple au profit de la banlieue : ~2,1 millions aujourd'hui, mais plus de **12 millions** dans l'aire métropolitaine.",
        },
      ];

      const FALLBACK =
        "Je ne connais pas encore ce sujet en détail — ma spécialité, c'est l'histoire de Paris : ses origines gauloises et romaines, le Moyen Âge, la Révolution, Haussmann, la Tour Eiffel, les guerres, Mai 68…\n\nEssayez par exemple : « Parlez-moi d'Haussmann », « Pourquoi la Bastille ? » ou demandez la « chronologie ».";

      const GREETINGS = [
        "bonjour",
        "salut",
        "bonsoir",
        "hello",
        "coucou",
        "hey",
      ];
      const THANKS = ["merci", "thanks", "grand merci"];

      /* ---------- UI ---------- */

      const chat = document.getElementById("chat");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const chipsBox = document.getElementById("chips");

      const SUGGESTIONS = [
        "Les origines : Lutèce",
        "La Révolution de 1789",
        "Haussmann et les grands boulevards",
        "La Tour Eiffel en 1889",
        "La Libération de 1944",
        "Toute la chronologie",
      ];

      function normalize(text) {
        return text
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9\s-]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function addMessage(role, html) {
        const wrap = document.createElement("div");
        wrap.className = "msg " + role;
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = role === "bot" ? "🏛" : "👤";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML = html;
        wrap.appendChild(avatar);
        wrap.appendChild(bubble);
        chat.appendChild(wrap);
        chat.scrollTop = chat.scrollHeight;
      }

      function showTyping() {
        const wrap = document.createElement("div");
        wrap.className = "msg bot typing";
        wrap.id = "typing";
        wrap.innerHTML =
          '<div class="avatar">🏛</div><div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
        chat.appendChild(wrap);
        chat.scrollTop = chat.scrollHeight;
      }

      function hideTyping() {
        const t = document.getElementById("typing");
        if (t) t.remove();
      }

      function toHtml(text) {
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
          .replace(/\*(.+?)\*/g, "<i>$1</i>");
      }

      function findAnswer(raw) {
        const q = normalize(raw);
        if (!q) return null;

        if (GREETINGS.some((g) => q === g || q.startsWith(g + " "))) {
          return "Bonjour ! Bienvenue dans mon salon d'histoire. Je peux vous conter 2 000 ans d'histoire de Paris : Lutèce, le Moyen Âge, la Révolution, Haussmann, la Commune, la Libération…\n\nPar quoi souhaitez-vous commencer ? Vous pouvez aussi taper « chronologie » pour un tour d'horizon complet.";
        }
        if (THANKS.includes(q)) {
          return "Avec grand plaisir ! N'hésitez pas si une autre époque de Paris vous intrigue — chaque siècle a ses histoires.";
        }

        let best = null;
        let bestScore = 0;
        for (const entry of KB) {
          let score = 0;
          for (const key of entry.keys) {
            const k = normalize(key);
            if (!k) continue;
            if (q.includes(k)) score += k.length > 3 ? 3 : 2;
          }
          if (score > bestScore) {
            bestScore = score;
            best = entry;
          }
        }
        return best ? best.answer : FALLBACK;
      }

      function send(text) {
        const value = (text || "").trim();
        if (!value) return;
        addMessage("user", toHtml(value));
        input.value = "";
        showTyping();
        const answer = findAnswer(value);
        const delay = 450 + Math.min(answer.length * 4, 900);
        setTimeout(() => {
          hideTyping();
          addMessage("bot", toHtml(answer));
        }, delay);
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        send(input.value);
      });

      SUGGESTIONS.forEach((s) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.textContent = s;
        chip.addEventListener("click", () => send(s));
        chipsBox.appendChild(chip);
      });

      /* Message d'accueil */
      addMessage(
        "bot",
        toHtml(
          "Bienvenue ! Je suis votre guide dans l'**Histoire d'une ville : Paris**.\n\nDe Lutèce, la bourgade gauloise sur la Seine, à la capitale de la mode et de la culture, je vous raconte 2 000 ans d'histoire : rois, révolutions, pierres et révolutions urbaines.\n\nChoisissez un sujet ci-dessous ou posez directement votre question.",
        ),
      );
      input.focus();
    </script>
  </body>
</html>
