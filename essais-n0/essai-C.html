<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paris through time — Chatbot histoire de Paris</title>
    <style>
      :root {
        --bg: #f4efe7;
        --panel: #fffdf9;
        --ink: #23201b;
        --muted: #7a7266;
        --accent: #1f4e5f;
        --accent-soft: #e3ecef;
        --user-bubble: #1f4e5f;
        --user-text: #ffffff;
        --bot-bubble: #f1ece2;
        --border: #e2dbcd;
        --gold: #b98a2f;
        font-family:
          "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        display: flex;
        justify-content: center;
        padding: 24px 12px;
      }
      .app {
        width: 100%;
        max-width: 720px;
        height: min(88vh, 860px);
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(60, 50, 30, 0.14);
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, #ffffff, #fbf8f1);
      }
      .crest {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 21px;
        flex-shrink: 0;
      }
      header h1 {
        margin: 0;
        font-size: 19px;
        letter-spacing: 0.2px;
      }
      header p {
        margin: 2px 0 0;
        font-size: 12.5px;
        color: var(--muted);
        font-style: italic;
      }
      .status {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #3f9d63;
      }
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 20px 20px 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        scroll-behavior: smooth;
      }
      .msg {
        max-width: 82%;
        line-height: 1.55;
        font-size: 15px;
        white-space: pre-line;
      }
      .msg.bot {
        align-self: flex-start;
        background: var(--bot-bubble);
        border: 1px solid var(--border);
        border-radius: 4px 16px 16px 16px;
        padding: 12px 15px;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--user-bubble);
        color: var(--user-text);
        border-radius: 16px 4px 16px 16px;
        padding: 12px 15px;
      }
      .msg.bot .era {
        display: inline-block;
        margin-bottom: 6px;
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--gold);
      }
      .msg.bot p {
        margin: 0 0 8px;
      }
      .msg.bot p:last-child {
        margin-bottom: 0;
      }
      .typing {
        align-self: flex-start;
        background: var(--bot-bubble);
        border: 1px solid var(--border);
        border-radius: 4px 16px 16px 16px;
        padding: 14px 16px;
        display: flex;
        gap: 5px;
      }
      .typing span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #b6ac98;
        animation: blink 1.1s infinite;
      }
      .typing span:nth-child(2) {
        animation-delay: 0.18s;
      }
      .typing span:nth-child(3) {
        animation-delay: 0.36s;
      }
      @keyframes blink {
        0%,
        70%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        35% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 20px 4px;
      }
      .chip {
        font: inherit;
        font-size: 12.5px;
        border: 1px solid var(--accent);
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: 999px;
        padding: 6px 13px;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .chip:hover {
        background: var(--accent);
        color: #fff;
      }
      footer {
        display: flex;
        gap: 10px;
        padding: 14px 20px 18px;
        border-top: 1px solid var(--border);
        background: #fbf8f1;
      }
      #input {
        flex: 1;
        font: inherit;
        font-size: 15px;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 11px 14px;
        background: #fff;
        color: var(--ink);
        outline: none;
      }
      #input:focus {
        border-color: var(--accent);
      }
      #send {
        font: inherit;
        font-size: 15px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 11px 20px;
        cursor: pointer;
      }
      #send:hover {
        background: #163d4b;
      }
      #send:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="crest">&#127942;</div>
        <div>
          <h1>Paris à travers le temps</h1>
          <p>
            Fluctuat nec mergitur — battue par les flots, elle ne sombre pas
          </p>
        </div>
        <div class="status"><span class="dot"></span>en ligne</div>
      </header>
      <div id="chat"></div>
      <div class="chips" id="chips"></div>
      <footer>
        <input
          id="input"
          type="text"
          placeholder="Posez une question sur l'histoire de Paris…"
          autocomplete="off"
        />
        <button id="send">Envoyer</button>
      </footer>
    </div>

          answer:
            "La devise de Paris est « Fluctuat nec mergitur » : « Il est battu par les flots, mais il ne sombre pas ». Elle accompagne le navire du blason de la ville, en référence aux bateliers de la Seine, ancêtres symboliques des Parisiens.\n\nElle fut popularisée après les attentats de 2015 comme un symbole de la résilience de la ville.",
        },
        {
          era: "Divers",
          kws: [
            "population",
            "habitants",
            "combien de gens",
            "demographie",
            "ville plus peuplee",
            "2 millions",
          ],
          answer:
            "Paris compte aujourd'hui environ 2,1 millions d'habitants intra-muros, mais son agglomération dépasse les 10 millions. Au fil de l'histoire, la population a connu des variations spectaculaires : la peste du XIVe siècle fit des ravages, tandis que l'industrialisation du XIXe siècle la fit exploser de 600 000 à plus de 2 millions d'habitants.",
        },
        {
          era: "Divers",
          kws: [
            "plus ancien",
            "plus vieux",
            "pont neuf",
            "premier pont",
            "cafe procope",
            "plus vieux cafe",
            "plus vieille maison",
            "history fun facts",
            "anecdote",
            "anecdotes",
            "curiosite",
            "curiosites",
            "saviez vous",
          ],
          answer:
            "Quelques pépites historiques :\n\n— Le Pont Neuf est le plus ancien pont de Paris (achevé en 1607).\n— Le café Procope (1686) est le plus ancien café de la ville encore en activité.\n— La tour Eiffel n'allait durer que 20 ans.\n— En 1870, les Parisiens assiégés mangèrent les animaux du Jardin des plantes.\n— Les ossements de six millions de Parisiens reposent dans les catacombes depuis la fin du XVIIIe siècle.\n\nDemandez-moi n'importe lequel de ces sujets pour en savoir plus !",
        },
        {
          era: "Divers",
          kws: [
            "catacombes",
            "catacombs",
            "ossuaire",
            "ossements",
            "tunnels",
            "carrieres",
            "empire de la mort",
          ],
          answer:
            "Sous Paris s'étendent plus de 300 km de galeries et d'anciennes carrières de calcaire. À la fin du XVIIIe siècle, on décida de vider les cimetières débordant d'ossements : les restes de six millions de Parisiens furent transférés dans l'ossuaire municipal, devenu les célèbres catacombes, ouvert au public à Denfert-Rochereau.\n\nL'entrée porte cette mise en garde : « Arrête, c'est ici l'empire de la mort ! ».",
        },
        {
          era: "Divers",
          kws: [
            "chronologie",
            "grandes dates",
            "frise",
            "resume",
            "synthese",
            "synthèse",
            "resume histoire",
            "apercu",
            "aperçu",
            "fais moi un tour",
            "vue d'ensemble",
          ],
          answer:
            "Grandes dates de l'histoire de Paris :\n\n— Vers 250 av. J.-C. : les Parisii s'installent sur la Seine\n— 52 av. J.-C. : conquête romaine, Lutèce\n— 508 : Clovis fait de Paris sa capitale\n— 987 : Hugues Capet, roi de France\n— 1163-1345 : construction de Notre-Dame\n— 1356-1358 : révolte d'Étienne Marcel\n— 1420-1436 : occupation anglaise pendant la guerre de Cent Ans\n— 1572 : massacre de la Saint-Barthélemy\n— 1610 : assassinat d'Henri IV\n— 14 juillet 1789 : prise de la Bastille\n— 1853-1870 : transformations de Haussmann\n— 1871 : la Commune\n— 1889 : tour Eiffel\n— 1944 : Libération de Paris\n— 1968 : mai 68\n\nSur quelle époque voulez-vous creuser ?",
        },
      ];

      /* ---------- Réponses conversationnelles ---------- */
      const SMALLTALK = [
        {
          kws: [
            "bonjour",
            "salut",
            "bonsoir",
            "hello",
            "coucou",
            "hey",
            "bjr",
            "re",
          ],
          answer:
            "Bonjour ! Bienvenue dans mon Paris historique. Je peux vous parler des origines gauloises, de la Révolution, d'Haussmann ou de bien d'autres sujets.\n\nQue souhaitez-vous découvrir ?",
        },
        {
          kws: [
            "merci",
            "thanks",
            "c parfait",
            "super",
            "genial",
            "cool",
            "top",
            "excellent",
          ],
          answer:
            "Avec grand plaisir ! N'hésitez pas à me poser d'autres questions — la ville a deux mille ans d'histoires à raconter.",
        },
        {
          kws: [
            "qui es tu",
            "qui etes vous",
            "tu es qui",
            "c'est qui",
            "presente toi",
            "presentez vous",
            "ton nom",
            "chatbot",
            "robot",
            "ia",
          ],
          answer:
            "Je suis le Chatbot de l'histoire de Paris, un petit guide historique 100 % hors ligne : toutes mes connaissances sont intégrées dans cette page.\n\nPosez-moi une question sur une époque, un monument, un personnage ou une grande date !",
        },
        {
          kws: [
            "au revoir",
            "bye",
            "a plus",
            "salutation finale",
            "ciao",
            "bonne journee",
          ],
          answer:
            "Au revoir, et à bientôt pour d'autres voyages dans le temps ! ",
        },
        {
          kws: [
            "aide",
            "help",
            "comment ca marche",
            "que peux tu faire",
            "que sais tu",
            "sujets",
            "topic",
            "exemples de questions",
          ],
          answer:
            "Je peux répondre à vos questions sur deux mille ans d'histoire de Paris ! Essayez par exemple :\n\n— « Qui étaient les Parisii ? »\n— « Parle-moi de la Révolution »\n— « Qu'est-ce qu'Haussmann a changé ? »\n— « Pourquoi la tour Eiffel a-t-elle été construite ? »\n— « Que s'est-il passé en 1944 ? »\n— « Raconte-moi les catacombes »",
        },
      ];

      const FALLBACKS = [
        "Hmm, je n'ai rien trouvé dans ma base de connaissances là-dessus. Je maîtrise l'histoire de Paris : ses origines, le Moyen Âge, la Révolution, Haussmann, la Commune, la Libération, mai 68…\n\nEssayez une autre formulation, ou touchez l'une des suggestions ci-dessous.",
        "Je ne suis pas certain de bien comprendre. Posez-moi plutôt une question sur une époque (Antiquité, Moyen Âge, Renaissance, Révolution…) ou un monument parisien.",
        "Bonne question… mais hors de mon terrain de jeu ! Je ne connais que l'histoire de Paris. Essayez par exemple : « Les origines de Paris », « La Commune » ou « Mai 68 ».",
      ];

      /* ---------- Moteur de réponse ---------- */
      const norm = (s) =>
        " " +
        s
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9\s]/g, " ")
          .replace(/\s+/g, " ")
          .trim() +
        " ";

      function score(text, entry) {
        let s = 0;
        for (const kw of entry.kws) {
          const nk = norm(kw);
          if (nk.includes(" ")) {
            // expression : forte valeur
            if (text.includes(nk)) s += 5;
          } else if (text.includes(" " + nk.trim() + " ")) {
            s += 3;
          }
        }
        return s;
      }

      function findAnswer(raw) {
        const t = norm(raw);
        if (t.trim().length < 2) return null;

        let best = null,
          bestScore = 0;
        const pools = [KB, SMALLTALK];
        for (const pool of pools) {
          for (const e of pool) {
            const sc = score(t, e);
            if (sc > bestScore) {
              bestScore = sc;
              best = e;
            }
          }
        }
        if (best && bestScore >= 3) return best;
        return null;
      }

      /* ---------- Interface ---------- */
      const chat = document.getElementById("chat");
      const input = document.getElementById("input");
      const send = document.getElementById("send");
      const chipsBox = document.getElementById("chips");

      let busy = false;
      let fallbackCount = 0;

      const CHIPS = [
        "Les origines de Paris",
        "La Révolution de 1789",
        "Haussmann",
        "La tour Eiffel",
        "La Libération de 1944",
        "Grandes dates",
      ];

      function renderChips(list) {
        chipsBox.innerHTML = "";
        list.forEach((label) => {
          const b = document.createElement("button");
          b.className = "chip";
          b.type = "button";
          b.textContent = label;
          b.addEventListener("click", () => {
            if (busy) return;
            b.remove();
            sendMessage(label);
          });
          chipsBox.appendChild(b);
        });
      }

      function addMsg(text, who, era) {
        const div = document.createElement("div");
        div.className = "msg " + who;
        if (era) {
          const tag = document.createElement("span");
          tag.className = "era";
          tag.textContent = era;
          div.appendChild(tag);
        }
        const p = document.createElement("p");
        p.textContent = text;
        div.appendChild(p);
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
      }

      function showTyping() {
        const d = document.createElement("div");
        d.className = "typing";
        d.innerHTML = "<span></span><span></span><span></span>";
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
        return d;
      }

      function botReply(text, era, delay) {
        busy = true;
        send.disabled = true;
        const ty = showTyping();
        const wait = delay || 600 + text.length * 3;
        setTimeout(
          () => {
            ty.remove();
            addMsg(text, "bot", era);
            busy = false;
            send.disabled = false;
            input.focus();
          },
          Math.min(wait, 2200),
        );
      }

      function sendMessage(raw) {
        const msg = raw.trim();
        if (!msg || busy) return;
        addMsg(msg, "user");
        input.value = "";

        const hit = findAnswer(msg);
        if (hit) {
          fallbackCount = 0;
          botReply(hit.answer, hit.era);
        } else {
          const f = FALLBACKS[fallbackCount % FALLBACKS.length];
          fallbackCount++;
          botReply(f, "À toutes époques");
        }
      }

      send.addEventListener("click", () => sendMessage(input.value));
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage(input.value);
      });

      /* ---------- Accueil ---------- */
      renderChips(CHIPS);
      botReply(
        "Bonjour et bienvenue ! Je suis votre guide dans deux mille ans d'histoire de Paris — des Parisii gaulois jusqu'à mai 68.\n\nPosez-moi une question, ou choisissez une suggestion pour commencer.",
        "Accueil",
        500,
      );
    </script>
  </body>
