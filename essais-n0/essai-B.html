<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot — Histoire de Paris</title>
    <style>
      :root {
        --bg: #f4efe6;
        --panel: #fffdf8;
        --seine: #23557a;
        --seine-dark: #17405e;
        --carmine: #a4393a;
        --ink: #2b2620;
        --muted: #7a7266;
        --border: #e4dccd;
        --bot-bubble: #ffffff;
        --user-bubble: #23557a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: "Georgia", "Times New Roman", serif;
        background:
          radial-gradient(
            circle at 15% 20%,
            rgba(35, 85, 122, 0.08),
            transparent 40%
          ),
          radial-gradient(
            circle at 85% 80%,
            rgba(164, 57, 58, 0.07),
            transparent 45%
          ),
          var(--bg);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .app {
        width: 100%;
        max-width: 760px;
        height: min(92vh, 860px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(43, 38, 32, 0.18);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        background: linear-gradient(135deg, var(--seine-dark), var(--seine));
        color: #fdf9f0;
        padding: 16px 22px;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .blason {
        width: 44px;
        height: 44px;
        flex: none;
        border-radius: 50%;
        background: #fdf9f0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      header h1 {
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      header .sub {
        font-size: 0.78rem;
        opacity: 0.85;
        font-style: italic;
        margin-top: 2px;
      }
      .status {
        margin-left: auto;
        font-size: 0.75rem;
        display: flex;
        align-items: center;
        gap: 6px;
        opacity: 0.9;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #8fd6a8;
      }
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 20px 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        scroll-behavior: smooth;
      }
      .msg {
        display: flex;
        gap: 10px;
        max-width: 88%;
      }
      .msg.user {
        align-self: flex-end;
        flex-direction: row-reverse;
      }
      .avatar {
        width: 34px;
        height: 34px;
        flex: none;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        border: 1px solid var(--border);
        background: #f0e9db;
      }
      .bubble {
        padding: 12px 15px;
        border-radius: 14px;
        font-size: 0.95rem;
        line-height: 1.55;
        white-space: pre-wrap;
      }
      .msg.bot .bubble {
        background: var(--bot-bubble);
        border: 1px solid var(--border);
        border-top-left-radius: 4px;
      }
      .msg.user .bubble {
        background: var(--user-bubble);
        color: #fdf9f0;
        border-top-right-radius: 4px;
      }
      .bubble b {
        color: var(--carmine);
      }
      .msg.user .bubble b {
        color: #ffd9a0;
      }
      .bubble .year {
        color: var(--seine);
        font-weight: bold;
      }
      .typing .bubble {
        display: flex;
        gap: 5px;
        align-items: center;
        height: 40px;
      }
      .typing .bubble span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
        animation: blink 1.2s infinite;
      }
      .typing .bubble span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing .bubble span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.25;
        }
        40% {
          opacity: 1;
        }
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 22px 4px;
      }
      .chip {
        font-family: inherit;
        font-size: 0.78rem;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #fbf7ee;
        color: var(--seine-dark);
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .chip:hover {
        background: var(--seine);
        color: #fdf9f0;
        border-color: var(--seine);
      }
      form {
        display: flex;
        gap: 10px;
        padding: 12px 22px 18px;
        border-top: 1px solid var(--border);
        background: #fbf8f1;
      }
      input {
        flex: 1;
        font-family: inherit;
        font-size: 0.95rem;
        padding: 11px 15px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        outline: none;
      }
      input:focus {
        border-color: var(--seine);
      }
      button.envoyer {
        font-family: inherit;
        font-size: 0.95rem;
        padding: 11px 20px;
        border: none;
        border-radius: 10px;
        background: var(--carmine);
        color: #fdf9f0;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button.envoyer:hover {
        background: #8a2f30;
      }
      footer {
        text-align: center;
        font-size: 0.7rem;
        color: var(--muted);
        padding: 0 10px 10px;
        font-style: italic;
      }
      @media (max-width: 520px) {
        .app {
          height: 100vh;
          border-radius: 0;
        }
        header h1 {
          font-size: 1rem;
        }
        .status {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" role="application" aria-label="Chatbot histoire de Paris">
      <header>
        <div class="blason" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <path
              d="M3 21V10l4-3 4 3v11M13 21V8l4-4 4 4v13"
              stroke="#23557a"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M3 21h18"
              stroke="#23557a"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <div>
          <h1>Histoire de Paris</h1>
          <div class="sub">
            Fluctuat nec mergitur — balayée par les flots, elle ne sombre pas
          </div>
        </div>
        <div class="status"><span class="dot"></span> En ligne</div>
      </header>

      <div id="chat" aria-live="polite"></div>

      <div class="chips" id="chips"></div>

      <form id="form" autocomplete="off">
        <input
          id="input"
          type="text"
          placeholder="Posez votre question : « Lutèce », « la Révolution », « Haussmann »…"
          aria-label="Votre question"
        />
        <button class="envoyer" type="submit">Envoyer</button>
      </form>
      <footer>
        Chatbot hors-ligne à réponses scriptées — aucune donnée n'est envoyée
        sur Internet.
      </footer>
    </div>

    <script>
      "use strict";

      /* ---------- Base de connaissances ---------- */
      const KB = [
        {
          k: [
            "lutèce",
            "lutetia",
            "origine",
            "origines",
            "parisii",
            "gaulois",
            "antiquité",
            "fondation",
            "fondé",
            "né",
          ],
          a: "Les origines 🏛️\n\nVers <span class=\"year\">250 av. J.-C.</span>, un peuple gaulois, les <b>Parisii</b>, s'installe sur l'île de la Cité et les berges de la Seine. C'est la naissance de <b>Lutèce</b> (Lutetia).\n\nEn <span class=\"year\">52 av. J.-C.</span>, la ville est prise par les Romains après la victoire de Labienus. La cité se romanise : forum, thermes, arènes (dont les vestiges des <b>Arènes de Lutèce</b> sont encore visibles dans le 5ᵉ arrondissement).\n\nC'est au IVᵉ siècle que la ville prend le nom de son peuple : <b>Paris</b>.",
        },
        {
          k: ["clovis", "capitale", "mérovingien", "508"],
          a: 'Clovis et la première capitale 👑\n\nEn <span class="year">508</span>, <b>Clovis</b>, roi des Francs, fait de Paris sa capitale. Il y siège et y est honoré comme « glorieux roi » par l\'évêque Geneviève… selon la tradition, il y serait aussi enterré (basilique des Saints-Apôtres, future abbaye Sainte-Geneviève).\n\nParis devient ainsi le cœur politique du royaume franc, avant de perdre ce rôle au profit de Soissons, puis de Aix-la-Chapelle sous Charlemagne.',
        },
        {
          k: ["geneviève", "sainte geneviève", "attila", "huns", "451"],
          a: 'Sainte Geneviève, la protectrice 🛡️\n\nVers <span class="year">451</span>, alors qu\'Attila et ses Huns menacent la Gaule, <b>Geneviève</b>, jeune chrétienne de Nanterre, exhorte les Parisiens à ne pas fuir : « Si les Huns viennent, la ville sera épargnée. » Attila contourne effectivement Paris.\n\nDevenue patronne de la ville, elle est invoquée à nouveau en <span class="year">885</span>… mais cette fois le siège des <b>Vikings</b> (885-887) est bien réel : Paris résiste plus d\'un an avant l\'arrivée du secours de Charles le Gros.',
        },
        {
          k: [
            "philippe auguste",
            "philippe",
            "muraille",
            "enceinte",
            "louvre",
            "forteresse",
            "1190",
            "moyen âge",
            "moyen-age",
            "médiéval",
          ],
          a: "Philippe Auguste et le Paris médiéval 🏰\n\nSous <b>Philippe Auguste</b> (1180-1223), Paris entre dans son premier âge d'or :\n• <span class=\"year\">1190-1215</span> : une vaste <b>muraille</b> protège la rive droite (on peut encore voir des vestiges rue François-Miron, dans le cour du Louvre ou au Musée de Cluny) ;\n• <span class=\"year\">1200</span> environ : le roi accorde des privilèges aux étudiants — la naissance de l'<b>Université de Paris</b> ;\n• Il fait bâtir le <b>Louvre</b>, alors une forteresse destinée à surveiller la Seine et défendre l'ouest de la ville.\n\nÀ sa mort, Paris est la plus grande ville d'Europe occidentale, avec environ 200 000 habitants.",
        },
        {
          k: [
            "sorbonne",
            "université",
            "étudiant",
            "étudiants",
            "quartier latin",
            "robert de sorbon",
          ],
          a: "La Sorbonne 🎓\n\nFondée vers <span class=\"year\">1257</span> par le théologien <b>Robert de Sorbon</b> comme collège pour étudiants pauvres, la Sorbonne devient le cœur de l'Université de Paris, l'une des plus anciennes d'Europe (l'université elle-même naît autour de 1200).\n\nLe quartier qui l'entoure — le <b>Quartier latin</b>, où l'on enseignait en latin — est encore aujourd'hui le quartier étudiant de la ville.",
        },
        {
          k: [
            "sainte chapelle",
            "sainte-chapelle",
            "louis ix",
            "saint louis",
            "rayonnant",
            "vitrail",
          ],
          a: "La Sainte-Chapelle ✨\n\nConstruite en seulement six ans (<span class=\"year\">1242-1248</span>) par <b>Saint Louis</b> (Louis IX) pour abriter la Couronne d'épinons et un fragment de la Vraie Croix rapportés des croisades, la Sainte-Chapelle est un joyau du gothique rayonnant.\n\nSes <b>1 113 vitraux</b> couvrent près des deux tiers des murs : l'intérieur semble être une cage de lumière. Elle est nichée dans l'enceinte du Palais de la Cité, résidence des rois jusqu'à Charles V.",
        },
        {
          k: [
            "etienne marcel",
            "étienne marcel",
            "jacquerie",
            "révolte",
            "1358",
            "guerre de cent ans",
          ],
          a: "Étienne Marcel et la révolte parisienne ⚔️\n\nMarchand drapier devenu <b>prévôt des marchands</b> (l'équivalent du maire), <b>Étienne Marcel</b> mène en 1357-1358 la première grande révolte urbaine de l'histoire de Paris, en pleine Guerre de Cent Ans et crise économique.\n\nIl impose au dauphin (futur Charles V) la <b>Grande Ordonnance</b> de 1357, embryon de contrôle du pouvoir royal. Mais l'invasion de Paris par les paysans de la <b>Jacquerie</b> lui fait perdre la population : il est assassiné en <span class=\"year\">1358</span> alors qu'il tentait de livrer une porte de la ville aux Anglais.",
        },
        {
          k: [
            "jeanne d'arc",
            "1429",
            "1436",
            "charles vii",
            "occupation anglaise",
            "bourgeois",
          ],
          a: "Jeanne d'Arc et Paris sous les Anglais 🌹\n\nPendant la Guerre de Cent Ans, Paris est aux mains des Bourguignons alliés aux Anglais (Traité de Troyes, 1420). En <span class=\"year\">1429</span>, <b>Jeanne d'Arc</b> tente de reprendre la ville d'assaut devant la porte Saint-Honoré — elle y est blessée, l'attaque échoue.\n\nParis ne revient à <b>Charles VII</b> qu'en <span class=\"year\">1436</span>, par négociation et paiement plutôt que par les armes. La ville, ruinée, mettra un siècle à s'en remettre.",

        {

            "henri iv",

            "pont neuf",
            "place des vosges",
            "place royale",
            "1607",

            "1610",
            "assassinat",
            "ravaillac",
          ],
          a: 'Henri IV, le Paris des débuts modernes 🌉\n\nRoi de France converti au catholicisme (« Paris vaut bien une messe », dit la légende), <b>Henri IV</b> embellit sa capitale :\n• <span class="year">1607</span> : inauguration du <b>Pont-Neuf</b>, premier pont de Paris sans maisons, avec ses trottoirs et sa statue équestre du roi ;\n• <span class="year">1612</span> : achèvement de la <b>Place Royale</b> (aujourd\'hui Place des Vosges), première place urbaine harmonieuse d\'Europe ;\n• Il achève le Louvre et relie les Tuileries par la Grande Galerie, aménage la Place Dauphine.\n\nIl est assassiné par <b>Ravaillac</b> le <span class="year">14 mai 1610</span>, rue de la Ferronnerie, en route vers l\'Arsenal.',
        },
        {
          k: [
            "louis xiv",

            "fronde",
            "versailles",
            "soleil",
            "colbert",
            "invalides",
            "observatoire",
            "portes saint",
          ],
          a: "Louis XIV : Paris révolté, puis délaissé ☀️\n\nJeune roi, Louis XIV connaît à Paris la <b>Fronde</b> (1648-1653), une révolte nobiliaire et populaire qui le traumatisera : sa famille doit fuir la ville de nuit. Devenu adulte, il quitte Paris pour <b>Versailles</b> (1682) et la cour s'y installe définitivement.\n\nMais Paris continue de s'embellir sous Colbert : collège des Quatre-Nations, Observatoire, <b>Hôtel des Invalides</b> (1670-1679) pour les soldats âgés, places royales triomphales (Victoires, Vendôme). La ville s'étend au-delant des murailles : les Faubourgs Saint-Antoine et Saint-Germain explosent.",
        },
        {
          k: [
            "révolution",
            "1789",
            "bastille",
            "14 juillet",
            "prise de la bastille",
            "terreur",
            "robespierre",
            "louis xvi",
            "guillotine",
            "1793",
            "1792",
            "tuileries",
          ],
          a: 'Paris et la Révolution française 🚨\n• <span class="year">14 juillet 1789</span> : la <b>prise de la Bastille</b>. La forteresse-prison, symbole de l\'arbitraire royal, est emportée par le peuple parisien venu chercher des poudres ;\n• <span class="year">5-6 octobre 1789</span> : marche des Parisiennes sur Versailles, la famille royale est ramenée aux Tuileries ;\n• <span class="year">10 août 1792</span> : prise des <b>Tuileries</b>, chute de la monarchie ;\n• <span class="year">21 janvier 1793</span> : <b>Louis XVI</b> guillotiné place de la Révolution (aujourd\'hui place de la Concorde) ;\n• <span class="year">1793-1794</span> : la <b>Terreur</b>, avec Robespierre et les sans-culottes parisiens, s\'achève par Thermidor (juillet 1794).\n\nParis devient le laboratoire politique de la France moderne : c\'est ici que naissent les notions de souveraineté populaire et de droits de l\'homme appliqués.',
        },
        {
          k: ["panthéon", "mirabeau", "voltaire", "rousseau", "hugo", "curie"],
          a: "Le Panthéon 🏛️\n\nConçu par Soufflot comme l'église Sainte-Geneviève, le bâtiment est transformé en <span class=\"year\">1791</span> en temple laïque des « grands hommes » : <b>Aux grands hommes, la patrie reconnaissante</b>.\n\nOn y honore Voltaire et Rousseau (1791), Mirabeau (puis retiré), Victor Hugo (1885), Marie et Pierre Curie (1995, première femme honorée « pour elle-même »), Marie Curie… Jean Moulin, Joséphine Baker et d'autres y reposent encore.",
        },
        {
          k: [
            "napoléon",
            "napoleon",
            "bonaparte",
            "empire",
            "arc de triomphe",
            "1804",
            "sacre",
            "concorde",
            "rivoli",
            "canal",
          ],
          a: "Napoléon et le Paris impérial 🦅\n\nSacre de <b>Napoléon Iᵉʳ</b> le <span class=\"year\">2 décembre 1804</span> à Notre-Dame. L'Empereur rêve d'une capitale monumentale :\n• <span class=\"year\">1806</span> : première pierre de l'<b>Arc de Triomphe</b> (achevé en 1836) ;\n• percée de la <b>rue de Rivoli</b>, numérotation des maisons, fontaines, ponts (Austerlitz, Iéna), canaux (Saint-Martin, Ourcq) ;\n• la place Louis XV devient place de la Concorde, décorée d'obélisque égyptienne plus tard (1836).\n\n« La Bastille ? Il ne faut pas deux heures pour visiter ce qui a eu tant de retentissement », aurait-il noté avec ironie en visitant les ruines.",
        },
        {
          k: [
            "haussmann",
            "haussmannien",
            "percée",
            "grands boulevards",

            "napoleon iii",
            "second empire",
            "1853",
            "rénovation",

            "transformation",
          ],
          a: "Haussmann, la grande transformation 🏗️\n\nNommé préfet de la Seine par <b>Napoléon III</b> en <span class=\"year\">1853</span>, le baron <b>Georges-Eugène Haussmann</b> dirige jusqu'en 1870 la plus grande rénovation urbaine de l'histoire de Paris :\n• percées d'avenues rectilignes (boulevard de Sébastopol, rue de Rivoli prolongée, avenue de l'Opéra) et de places étoilées (Étoile, République) ;\n• immeubles à façades unifiées, balcons filants au 2ᵉ et 5ᵉ étages — le style <b>haussmannien</b> ;\n• <b>603 km d'égouts</b> modernisés sous Belgrand, aqueducs, parcs (Bois de Boulogne et de Vincennes, parc Montsouris, Buttes-Chaumont) ;\n• gares (Nord, Est, Lyon, Austerlitz…) et réseau ferroviaire périphérique.\n\nButs affichés : circulation, salubrité… et contrôle des barricades. Bilan contrasté : des quartiers entiers du Moyen Âge disparaissent, mais Paris devient la « ville lumière » moderne du monde entier.",

          k: [
            "commune",
            "1871",
            "hôtel de ville",

            "semaine sanglante",

          a: "La Commune de Paris 🔥\n\nAprès la défaite de 1870 face à la Prusse et le siège de la ville (hiver 1870-71), les Parisiens refusent la paix. Le <span class=\"year\">18 mars 1871</span>, la Garde nationale se soulève : c'est la <b>Commune</b>, une insurrection qui gouverne Paris 72 jours, avec des mesures sociales avancées (séparation Église-État, école gratuite, travailleurs aux ateliers abandonnés).\n\nElle est écrasée dans le sang pendant la <b>Semaine sanglante</b> (21-28 mai 1871) : entre 6 000 et 20 000 morts selon les estimations, plus les déportations. L'Hôtel de Ville et les Tuileries brûlent. Ce souvenir marquera durablement la mémoire ouvrière.",
        },
        {
          k: [
            "tour eiffel",
            "eiffel",
            "1889",
            "expo",
            "exposition universelle",

            "protestation",
          ],
          a: "La Tour Eiffel 🗼\n\nÉlevée en <span class=\"year\">1889</span> pour l'<b>Exposition universelle</b> célébrant le centenaire de la Révolution, la tour de <b>Gustave Eiffel</b> (avec ses ingénieurs Koechlin et Nouguier) mesure alors 312 m — la plus haute structure du monde jusqu'en 1929 (aujourd'hui 330 m avec antennes).\n\nElle était prévue temporaire et véhémentement contestée : des artistes comme Maupassant ou Dumas fils signent une pétition contre cette « tour gigantesque de tôle noire ». Sauvée par son utilité scientifique (radio, télégraphie), elle devient le symbole même de Paris. Aujourd'hui, environ 7 millions de visiteurs par an.",
        },
        {
          k: [
            "métro",
            "metro",
            "1900",
            "guimard",
            "port dauphine",
            "ligne 1",
            "égout",
          ],
          a: "Le Métro 🚇\n\nInauguré le <span class=\"year\">19 juillet 1900</span> pour l'Exposition universelle, avec la ligne 1 (Porte de Vincennes – Porte Maillot). Le principe est déjà le même qu'aujourd'hui : cartes en main, stations rapprochées (500-600 m), correspondances.\n\nLes entrées en fonte verte de style <b>Art nouveau</b> signées <b>Hector Guimard</b> deviennent une icône immédiate de la ville. Aujourd'hui : 14 lignes principales (+ lignes complémentaires), environ 320 stations, plus de 2 milliards de voyages par an — sur le réseau le plus fréquenté d'Europe occidentale après Moscou.",
        },
        {
          k: [
            "belle époque",

            "sacré coeur",

      /* ---------- Normalisation & moteur de correspondance ---------- */
      function normalise(txt) {
        return txt
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9\s'-]/g, " ")
          .replace(/\s+/g, " ")

          let score = 0;
          for (const mot of entree.k) {
            const nm = normalise(mot);
            if (!nm) continue;
            if (nq.includes(nm)) {
              score += nm.includes(" ") ? 3 : nm.length >= 5 ? 2 : 1;
            }
          }
          if (score > meilleurScore) {
            meilleurScore = score;
            meilleur = entree;
          }
        }
        return meilleurScore >= 2 ? meilleur.a : null;
      }
